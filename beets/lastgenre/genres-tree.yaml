# beets lastgenre genre tree
#
# Built from the RateYourMusic genre hierarchy. Every name below is an entry in genres.txt,
# including the top-level families, so lastgenre's whitelist never filters out a parent.
# Each genre appears exactly once, under the RYM family it is most closely tied to
# (lastgenre only follows the first match, so duplicates would have no effect).
# Genres that exist in genres.txt but have no sensible family are left out; they still work
# as tags, they just have no parents.
#
