# ==============================================================================
# yt-dlp configuration
# ==============================================================================


# ------------------------------------------------------------------------------
# Paths and filenames
# ------------------------------------------------------------------------------

# Where finished downloads are saved
--paths "home:~/Movies/Videos"

# Where in-progress and intermediate files are kept until the download finishes
--paths "temp:~/Movies/.temp"

# Filename template: extractor/uploader/YYYY-MM-DD - title [height].ext
--output "%(extractor)s/%(uploader)s/%(upload_date>%Y-%m-%d)s - %(title)s [%(height)sp].%(ext)s"

# Strip special characters and replace spaces with underscores.
# NOTE: this would also rewrite the spaces, dashes, and brackets in the template above.
# --restrict-filenames

# Lighter alternative: only replace characters that are illegal on Windows
# --windows-filenames


# ------------------------------------------------------------------------------
# Downloader
# ------------------------------------------------------------------------------

# Hand downloads off to aria2c
--downloader aria2c

# Parallel fragment downloads. This is a native-downloader option, so it only applies
# when yt-dlp falls back from aria2c (for example, native HLS streams).
--concurrent-fragments 5

# Retry attempts for a whole-file download error
--retries 10

# Retry attempts for each individual fragment of a segmented (DASH/HLS) download
--fragment-retries 50

# Wait a random 1-2 seconds before each download to avoid hammering the server
--min-sleep-interval 1
--max-sleep-interval 2

# Skip files that already exist instead of overwriting them
--no-overwrites

# If a URL points to both a video and a playlist, download only the video
--no-playlist


# ------------------------------------------------------------------------------
# Format selection and merging
# ------------------------------------------------------------------------------

# Best video + best audio, capped at 1440p; falls back to the best single file
-f "bestvideo[height<=1440]+bestaudio/best[height<=1440]"

# Same as above, with no resolution cap
# -f "bestvideo+bestaudio"

# Merge video and audio into an MKV container (original codecs are kept, e.g. AV1/VP9 + Opus)
--merge-output-format mkv

# Optional: re-encode to x265/AAC instead of keeping the original codecs. Very CPU-heavy.
# yt-dlp skips recoding when the file is already in the target container, so if you enable
# this, change --merge-output-format above to a different container (e.g. mp4).
# --recode-video mkv
# --postprocessor-args "VideoConvertor:-c:v libx265 -preset medium -crf 20 -c:a aac -b:a 192k"


# ------------------------------------------------------------------------------
# Subtitles, metadata, and thumbnail
# ------------------------------------------------------------------------------

# Download every available subtitle language (except live chat, which can't be embedded)
--write-subs
--sub-langs "all,-live_chat"

# Embed the subtitles in the video file
--embed-subs

# Embed metadata and chapters in the video file
--embed-metadata

# Embed the thumbnail as cover art in the video file
--embed-thumbnail


# ------------------------------------------------------------------------------
# Console output
# ------------------------------------------------------------------------------

# Print the final file path once all post-processing and moving is done.
# NOTE: --print implies --quiet, which is why --progress is needed below.
--print after_move:filepath

# Show the progress bar even in quiet mode
--progress

# Show download progress in the terminal window title
--console-title
